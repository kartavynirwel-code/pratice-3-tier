server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-tracker
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tasktracker}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema comes from db/schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true  # /actuator/health/liveness and /readiness

app:
  env: ${APP_ENV:local}
  cors-origin: ${CORS_ORIGIN:}
  db-host: ${DB_HOST:localhost}
  db-port: ${DB_PORT:3306}
